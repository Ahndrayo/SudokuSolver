<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light;
      font-family: sans-serif;
    }

    body {
      margin: 0;
      background: #ffffff;
    }

    .mode-bar,
    .actions {
      display: grid;
      max-width: 630px;
      margin: 0 auto;
      gap: 0.6rem;
    }

    .mode-bar {
      grid-template-columns: 1fr 1fr;
      margin-bottom: 0.75rem;
    }

    .mode-button,
    .action-button {
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      padding: 0.6rem 0.75rem;
      border: 1px solid #c8c8c8;
      border-radius: 0.4rem;
      background: #ffffff;
      color: #222222;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .mode-button.active {
      border-color: #333333;
      background: #333333;
      color: #ffffff;
      font-weight: 700;
    }

    .mode-button:hover,
    .action-button:hover {
      border-color: #777777;
    }

    .sudoku-grid {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      max-width: 630px;
      margin: 0 auto;
      background: #ffffff;
      border-top: 2px solid #111111;
      border-left: 2px solid #111111;
    }

    .sudoku-cell {
      box-sizing: border-box;
      width: 100%;
      aspect-ratio: 1 / 1;
      min-width: 0;
      padding: 0;
      border: 0;
      border-right: 1px solid #333333;
      border-bottom: 1px solid #333333;
      border-radius: 0;
      outline: none;
      background: #ffffff;
      color: #1f5fbf;
      font-size: clamp(1.1rem, 3vw, 1.55rem);
      text-align: center;
    }

    .sudoku-cell:focus {
      position: relative;
      z-index: 1;
      outline: 2px solid #ff4b4b;
      outline-offset: -2px;
    }

    .sudoku-cell.clue-cell {
      color: #111111;
      font-weight: 700;
    }

    .sudoku-cell.answer-cell {
      color: #1f5fbf;
      font-weight: 400;
    }

    .sudoku-cell.correct-cell {
      background: #e8f5e9;
      color: #1f5fbf;
    }

    .sudoku-cell.incorrect-cell,
    .sudoku-cell.invalid-cell {
      background: #ffebee;
      color: #c62828;
    }

    .sudoku-cell.blank-cell {
      background: #fff8e1;
    }

    .sudoku-cell[readonly] {
      cursor: default;
    }

    .sudoku-cell:nth-child(3n) {
      border-right: 3px solid #111111;
    }

    .sudoku-cell:nth-child(n + 19):nth-child(-n + 27),
    .sudoku-cell:nth-child(n + 46):nth-child(-n + 54) {
      border-bottom: 3px solid #111111;
    }

    .actions {
      grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
      margin-top: 0.75rem;
    }

    .action-button.primary {
      border-color: #ff4b4b;
      background: #ff4b4b;
      color: #ffffff;
    }

    .action-button.create {
      border-color: #2d6cdf;
      background: #2d6cdf;
      color: #ffffff;
    }

    .action-button:disabled {
      border-color: #d0d0d0;
      background: #e5e5e5;
      color: #888888;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="mode-bar">
    <button id="play-mode" class="mode-button" type="button">Play Puzzle</button>
    <button id="custom-mode" class="mode-button" type="button">Custom Puzzle</button>
  </div>

  <div id="grid" class="sudoku-grid" aria-label="Sudoku grid"></div>

  <div class="actions">
    <button id="check" class="action-button primary" type="button">Check Answer</button>
    <button id="reset" class="action-button" type="button">Reset Answers</button>
    <button id="new" class="action-button" type="button">New Puzzle</button>
    <button id="reveal" class="action-button" type="button">Reveal Solution</button>
    <button id="create" class="action-button create hidden" type="button">Create Puzzle</button>
    <button id="clear" class="action-button hidden" type="button">Clear</button>
    <button id="cancel" class="action-button hidden" type="button">Cancel</button>
  </div>

  <script>
    const GRID_SIZE = 9;
    const gridElement = document.getElementById("grid");
    const inputs = [];
    const modeButtons = {
      play: document.getElementById("play-mode"),
      custom: document.getElementById("custom-mode"),
    };
    const actionButtons = {
      check: document.getElementById("check"),
      reset: document.getElementById("reset"),
      newPuzzle: document.getElementById("new"),
      reveal: document.getElementById("reveal"),
      create: document.getElementById("create"),
      clear: document.getElementById("clear"),
      cancel: document.getElementById("cancel"),
    };

    let currentMode = "play";
    let currentClues = [];
    let currentSolution = null;
    let currentCheckState = "ready";
    let currentValidationCells = [];

    function sendMessage(type, data) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type,
        ...data,
      }, "*");
    }

    function setFrameHeight() {
      sendMessage("streamlit:setFrameHeight", {
        height: document.body.scrollHeight,
      });
    }

    function setComponentValue(value) {
      sendMessage("streamlit:setComponentValue", { value });
    }

    function getGrid() {
      return inputs.map((input) => {
        const value = input.value.trim();
        return value === "" ? 0 : Number(value);
      }).reduce((grid, value, index) => {
        const row = Math.floor(index / GRID_SIZE);
        if (!grid[row]) grid[row] = [];
        grid[row].push(value);
        return grid;
      }, []);
    }

    function hasProgress() {
      return currentMode === "setup"
        ? inputs.some((input) => input.value.trim() !== "")
        : currentCheckState !== "ready" || inputs.some((input, index) => {
            const row = Math.floor(index / GRID_SIZE);
            const column = index % GRID_SIZE;
            return !currentClues?.[row]?.[column] && input.value.trim() !== "";
          });
    }

    function confirmModeChange(message) {
      return !hasProgress() || window.confirm(message);
    }

    function hasValidationCell(row, column) {
      return currentValidationCells.some(
        (cell) => cell[0] === row && cell[1] === column,
      );
    }

    function focusCell(row, column) {
      if (row < 0 || row >= GRID_SIZE || column < 0 || column >= GRID_SIZE) {
        return;
      }
      inputs[row * GRID_SIZE + column].focus();
      inputs[row * GRID_SIZE + column].select();
    }

    function updateCellStyle(input, row, column) {
      input.classList.remove(
        "clue-cell",
        "answer-cell",
        "correct-cell",
        "incorrect-cell",
        "blank-cell",
        "invalid-cell",
      );

      const value = input.value.trim();
      const isClue = currentMode === "play" && currentClues?.[row]?.[column];
      if (hasValidationCell(row, column) && value !== "") {
        input.classList.add("invalid-cell");
        return;
      }

      if (isClue) {
        input.classList.add("clue-cell");
        return;
      }

      if (currentMode === "setup") {
        if (value !== "") input.classList.add("clue-cell");
        return;
      }

      if (value === "") {
        if (currentCheckState === "checked") {
          input.classList.add("blank-cell");
        }
        return;
      }

      if (
        currentCheckState === "checked" ||
        currentCheckState === "complete" ||
        currentCheckState === "revealed"
      ) {
        if (currentSolution?.[row]?.[column] === Number(value)) {
          input.classList.add("correct-cell");
        } else {
          input.classList.add("incorrect-cell");
        }
      } else {
        input.classList.add("answer-cell");
      }
    }

    function updateActions() {
      const setup = currentMode === "setup";
      [actionButtons.check, actionButtons.reset, actionButtons.newPuzzle,
        actionButtons.reveal].forEach((button) => {
        button.classList.toggle("hidden", setup);
      });
      [actionButtons.create, actionButtons.clear, actionButtons.cancel]
        .forEach((button) => button.classList.toggle("hidden", !setup));

      modeButtons.play.classList.toggle("active", !setup);
      modeButtons.custom.classList.toggle("active", setup);
      actionButtons.check.disabled =
        currentCheckState === "complete" || currentCheckState === "revealed";
    }

    function createGrid(initialGrid, clueGrid, solutionGrid, mode, checkState, validationCells) {
      currentMode = mode;
      currentClues = clueGrid || [];
      currentSolution = solutionGrid || null;
      currentCheckState = checkState || "ready";
      currentValidationCells = validationCells || [];
      gridElement.innerHTML = "";
      inputs.length = 0;
      updateActions();

      for (let row = 0; row < GRID_SIZE; row += 1) {
        for (let column = 0; column < GRID_SIZE; column += 1) {
          const input = document.createElement("input");
          input.className = "sudoku-cell";
          input.type = "text";
          input.inputMode = "numeric";
          input.maxLength = 1;
          input.autocomplete = "off";
          input.setAttribute("aria-label", `Row ${row + 1}, Column ${column + 1}`);

          const clue = currentClues?.[row]?.[column] || 0;
          const answer = initialGrid?.[row]?.[column] || 0;
          input.value = String(clue || answer || "");
          input.readOnly = currentMode === "play" && (
            Boolean(clue) ||
            currentCheckState === "complete" ||
            currentCheckState === "revealed"
          );
          input.tabIndex = input.readOnly ? -1 : 0;
          updateCellStyle(input, row, column);

          input.addEventListener("input", () => {
            input.value = input.value.replace(/[^1-9]/g, "").slice(0, 1);
            currentValidationCells = currentValidationCells.filter(
              (cell) => cell[0] !== row || cell[1] !== column,
            );
            updateCellStyle(input, row, column);
          });

          input.addEventListener("keydown", (event) => {
            const moves = {
              ArrowLeft: [0, -1],
              ArrowRight: [0, 1],
              ArrowUp: [-1, 0],
              ArrowDown: [1, 0],
            };

            if (moves[event.key]) {
              event.preventDefault();
              const [rowDelta, columnDelta] = moves[event.key];
              focusCell(row + rowDelta, column + columnDelta);
            }
          });

          gridElement.appendChild(input);
          inputs.push(input);
        }
      }

      setFrameHeight();
    }

    modeButtons.custom.addEventListener("click", () => {
      if (currentMode === "setup") return;
      if (window.confirm("Switching to Custom Puzzle will discard the current puzzle and any progress. Continue?")) {
        setComponentValue({ action: "custom_puzzle", grid: getGrid() });
      }
    });

    modeButtons.play.addEventListener("click", () => {
      if (currentMode === "play") return;
      if (confirmModeChange("Leave Custom Puzzle mode and discard this custom grid?")) {
        setComponentValue({ action: "play_mode", grid: getGrid() });
      }
    });

    actionButtons.check.addEventListener("click", () => {
      setComponentValue({ action: "check", grid: getGrid() });
    });

    actionButtons.reset.addEventListener("click", () => {
      setComponentValue({ action: "reset_answers", grid: getGrid() });
    });

    actionButtons.newPuzzle.addEventListener("click", () => {
      setComponentValue({ action: "new_puzzle", grid: getGrid() });
    });

    actionButtons.reveal.addEventListener("click", () => {
      setComponentValue({ action: "reveal", grid: getGrid() });
    });

    actionButtons.create.addEventListener("click", () => {
      setComponentValue({ action: "create_puzzle", grid: getGrid() });
    });

    actionButtons.clear.addEventListener("click", () => {
      setComponentValue({ action: "clear", grid: getGrid() });
    });

    actionButtons.cancel.addEventListener("click", () => {
      setComponentValue({ action: "cancel_custom", grid: getGrid() });
    });

    window.addEventListener("message", (event) => {
      if (event.data.type === "streamlit:render") {
        createGrid(
          event.data.args.grid || [],
          event.data.args.clues || [],
          event.data.args.solution || null,
          event.data.args.mode || "play",
          event.data.args.check_state || "ready",
          event.data.args.validation_cells || [],
        );
      }
    });

    sendMessage("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
